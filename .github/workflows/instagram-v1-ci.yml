name: Instagram V1 branch verification
on:
  push:
    branches: [feat/instagram-account-connection]
permissions:
  contents: read
concurrency:
  group: instagram-v1-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Owner app checks
        run: npm test
      - name: Expo Android production export
        run: npx expo export --platform android --output-dir .expo/export-check
